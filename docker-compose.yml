services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: security
      POSTGRES_PASSWORD: security
      POSTGRES_DB: security_center
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security -d security_center"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://security:security@postgres:5432/security_center?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-change-me-in-production}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      STORAGE_PATH: /data/exports
    volumes:
      - export_data:/data/exports
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://security:security@postgres:5432/security_center?schema=public
      STORAGE_PATH: /data/exports
    volumes:
      - export_data:/data/exports
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  export_data:
