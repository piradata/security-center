services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: security
      POSTGRES_PASSWORD: security
      POSTGRES_DB: security_center
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security -d security_center"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://security:security@postgres:5432/security_center?schema=public
      STORAGE_PATH: /data/exports
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - export_data:/data/exports
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://security:security@postgres:5432/security_center?schema=public
      STORAGE_PATH: /data/exports
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - export_data:/data/exports
    command:
      [
        "sh",
        "-c",
        "while [ ! -d node_modules/next ]; do sleep 2; done; pnpm exec prisma generate && pnpm run worker",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  postgres_data:
  export_data:
  node_modules:
